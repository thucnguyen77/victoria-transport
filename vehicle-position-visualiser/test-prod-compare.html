<!DOCTYPE html>
<html lang="en">

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Transport Victoria - Vehicle Position Visualiser</title>

    <!-- <link rel="shortcut icon" type="image/x-icon" href="../img/favicon.ico" /> -->

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/pbf@3.0.5/dist/pbf.js"></script>
    <script src="https://unpkg.com/gtfs-realtime-pbf-js-module@1.0.0/gtfs-realtime.browser.proto.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        #app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #map {
            flex: 1;
            height: 100%;
            min-width: 0;
        }

        #resizer {
            width: 5px;
            flex-shrink: 0;
            cursor: col-resize;
            background: #e5e7eb;
            position: relative;
            transition: background 0.15s;
            z-index: 10;
        }

        #resizer:hover,
        #resizer.dragging {
            background: #78be20;
        }

        #resizer::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 32px;
            width: 3px;
            border-left: 1px dotted #9ca3af;
            border-right: 1px dotted #9ca3af;
        }
    </style>

</head>

<body>
    <div id="app-container">
        <div id="map"></div>
        <div id="resizer"></div>
        <div id="side-panel" style="width:220px"
            class="min-w-[150px] max-w-[600px] bg-gray-50 border-l border-gray-200 flex flex-col shadow-inner overflow-hidden">
            <!-- Controls -->
            <div class="flex flex-col flex-shrink-0 px-4 py-5 gap-3">
                <h3 class="text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-0">API Settings</h3>

                <label class="text-xs font-semibold text-gray-600 block -mb-1" for="prod-api-key-input">Prod API
                    Key</label>
                <input id="prod-api-key-input" type="password" placeholder="Enter API key…" value="f6514dcd-d1fa-46fb-8f0c-ad10cd069ace"
                    class="w-full px-2 py-1.5 text-xs font-mono border border-gray-300 rounded-md bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#78be20] focus:border-transparent transition" />

                <label class="text-xs font-semibold text-gray-600 block -mb-1" for="test-api-key-input">Test API
                    Key</label>
                <input id="test-api-key-input" type="password" placeholder="Enter API key…" value="65ceef57-39d0-468b-be2a-dbf58986b655"
                    class="w-full px-2 py-1.5 text-xs font-mono border border-gray-300 rounded-md bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#78be20] focus:border-transparent transition" />

                <label class="text-xs font-semibold text-gray-600 block -mb-1" for="refresh-interval-input">Refresh
                    interval (s)</label>
                <div class="flex items-center gap-2">
                    <input id="refresh-interval-input" type="number" min="1" max="300" value="10"
                        class="flex-1 min-w-0 px-2 py-1.5 text-xs border border-gray-300 rounded-md bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#78be20] focus:border-transparent transition" />
                    <button id="btn-toggle"
                        class="px-3 py-1.5 text-sm font-semibold rounded-md text-white bg-[#78be20] hover:opacity-90 transition-opacity cursor-pointer whitespace-nowrap">&#9654;
                        Start</button>
                </div>
                <div id="refresh-status" class="text-xs text-gray-500 mt-1">Please enter API key.</div>
            </div>
            <!-- Features table -->
            <div class="flex flex-col flex-1 min-h-0 border-t border-gray-200">
                <h3 class="text-[11px] font-bold text-gray-400 uppercase tracking-widest flex-shrink-0 px-4 py-2 flex items-center gap-1">
                    <img src="img/Melbourne_tram_logo.svg" alt="Tram Logo" width="16" height="16">
                    Prod Vehicles <span id="prod-features-count" class="normal-case font-normal text-gray-400"></span></h3>
                <div class="overflow-auto flex-1 min-h-0">
                    <table id="prod-features-table" class="w-full text-[10px] text-gray-700 border-collapse">
                        <thead class="sticky top-0 bg-gray-100 z-10">
                            <tr>
                                <th
                                    class="px-2 py-1 text-left font-semibold text-gray-500 border-b border-gray-200 whitespace-nowrap">
                                    Timestamp</th>
                                <th
                                    class="px-2 py-1 text-left font-semibold text-gray-500 border-b border-gray-200 whitespace-nowrap">
                                    Vehicle</th>
                                <th
                                    class="px-2 py-1 text-left font-semibold text-gray-500 border-b border-gray-200 whitespace-nowrap">
                                    Trip ID</th>
                                <th
                                    class="px-2 py-1 text-left font-semibold text-gray-500 border-b border-gray-200 whitespace-nowrap">
                                    Start</th>
                                <th
                                    class="px-2 py-1 text-left font-semibold text-gray-500 border-b border-gray-200 whitespace-nowrap">
                                    Lat</th>
                                <th
                                    class="px-2 py-1 text-left font-semibold text-gray-500 border-b border-gray-200 whitespace-nowrap">
                                    Lon</th>
                            </tr>
                        </thead>
                        <tbody id="prod-features-tbody"></tbody>
                    </table>
                </div>
            </div>

            <div class="flex flex-col flex-1 min-h-0 border-t border-gray-200">
                <h3 class="text-[11px] font-bold text-gray-400 uppercase tracking-widest flex-shrink-0 px-4 py-2 flex items-center gap-1">
                    <img src="img/Melbourne_tram_logo_test.svg" alt="Tram Logo" width="16" height="16">
                    Test Vehicles <span id="test-features-count" class="normal-case font-normal text-gray-400"></span></h3>
                <div class="overflow-auto flex-1 min-h-0">
                    <table id="test-features-table" class="w-full text-[10px] text-gray-700 border-collapse">
                        <thead class="sticky top-0 bg-gray-100 z-10">
                            <tr>
                                <th
                                    class="px-2 py-1 text-left font-semibold text-gray-500 border-b border-gray-200 whitespace-nowrap">
                                    Timestamp</th>
                                <th
                                    class="px-2 py-1 text-left font-semibold text-gray-500 border-b border-gray-200 whitespace-nowrap">
                                    Vehicle</th>
                                <th
                                    class="px-2 py-1 text-left font-semibold text-gray-500 border-b border-gray-200 whitespace-nowrap">
                                    Trip ID</th>
                                <th
                                    class="px-2 py-1 text-left font-semibold text-gray-500 border-b border-gray-200 whitespace-nowrap">
                                    Start</th>
                                <th
                                    class="px-2 py-1 text-left font-semibold text-gray-500 border-b border-gray-200 whitespace-nowrap">
                                    Lat</th>
                                <th
                                    class="px-2 py-1 text-left font-semibold text-gray-500 border-b border-gray-200 whitespace-nowrap">
                                    Lon</th>
                            </tr>
                        </thead>
                        <tbody id="test-features-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="lib/zip.min.js"></script>
    <script src="gtfs.js"></script>

    <script src="resizer.js"></script>
    <script src="app.js"></script>

    </div><!-- #app-container -->
</body>

</html>
